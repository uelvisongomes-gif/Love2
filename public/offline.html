<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>love2 — offline</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #faf7f2;
      color: #333;
      text-align: center;
    }
    .box {
      max-width: 320px;
      padding: 32px;
    }
    .logo {
      width: 64px;
      height: 64px;
      margin: 0 auto 16px;
      background: #c9694a;
      border-radius: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #faf7f2;
      font-family: Georgia, serif;
      font-style: italic;
      font-size: 22px;
    }
    h1 {
      font-family: Georgia, serif;
      font-weight: 500;
      font-style: italic;
      color: #c9694a;
      font-size: 24px;
      margin: 0 0 12px;
    }
    p {
      color: #666;
      line-height: 1.5;
      font-size: 15px;
      margin: 0 0 24px;
    }
    button {
      background: #c9694a;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="logo">love2</div>
    <h1>Sem conexão</h1>
    <p>Você tá offline. Assim que a rede voltar, o love2 volta também.</p>
    <button onclick="location.reload()">Tentar de novo</button>
  </div>
</body>
</html>
